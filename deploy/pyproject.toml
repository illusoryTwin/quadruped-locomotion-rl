[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quadruped-locomotion-deploy"
version = "0.1.0"
description = "Lightweight deployment for quadruped locomotion RL policies"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Ekaterina Mozhegova", email = "mozhegova04@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "mujoco>=3.0",
    "pygame>=2.0",
    "unitree_sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git",
]

[project.optional-dependencies]
train = [
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "packaging",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["core*", "runners*", "utils*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
